  <style>
    :root{--bg:#f3f2ee;--card:#fff;--ink:#17322d;--muted:#697873;--line:#d9dedb;--brand:#174d43;--brand2:#23685a;--soft:#eaf2ef;--warn:#fff5dc;--danger:#ffe9e6;--ok:#e8f5ee;--shadow:0 18px 50px rgba(23,50,45,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.hidden{display:none!important}
    .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px}.brand small{display:block;color:var(--muted)}.mark{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:850;box-shadow:0 10px 24px rgba(23,77,67,.2)}
    .header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.badge{display:inline-flex;border-radius:999px;padding:7px 10px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:750}.badge.demo{background:var(--warn);color:#7a5200}
    .btn{border:0;border-radius:13px;padding:12px 16px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .16s ease,box-shadow .2s ease,background .2s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.985)}.primary{background:var(--brand);color:#fff;box-shadow:0 9px 22px rgba(23,77,67,.18)}.secondary{background:#eef1ef;color:var(--ink)}.danger{background:#9f302a;color:#fff}
    .shell{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    .nav button{width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--ink);box-shadow:none}.nav button.active{background:var(--soft);color:var(--brand)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
    .hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{margin:6px 0 8px;font-size:28px}.hero p{max-width:720px}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.card{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff;transition:transform .18s ease,box-shadow .22s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,50,45,.08)}.card h3{margin:0 0 7px}.metric{font-size:26px;font-weight:850}.action-card{border:2px solid var(--brand);background:linear-gradient(180deg,#fff,var(--soft))}
    .stack{display:grid;gap:10px}.update{border-left:4px solid var(--brand)}.update.critical{border-left-color:#9f302a;background:var(--danger)}.update-state-unread{border-color:#d48a00;background:#fff5dc}.update-state-read{border-color:#6f91a8;background:#eef5f8}.update-state-passed{border-color:#2a8057;background:#e8f5ee}.tile-red{border-color:#c24b3a;background:#ffe9e6}.tile-yellow{border-color:#d4a017;background:#fff5dc}.tile-green{border-color:#2a8057;background:#e8f5ee}.learn-tile{cursor:pointer;text-align:left;width:100%}.learn-tile h3{margin:0 0 8px}.skip-box{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:14px}.skip-box input[type=password]{width:100%;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}.check{display:flex;align-items:flex-start;gap:10px}.check input{margin-top:3px}.quiz-option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;margin:6px 0}.quiz-option.selected{background:var(--brand);color:#fff;border-color:var(--brand)}.quiz-option.is-correct,.check.quiz-choice.is-correct{background:var(--ok);color:#17643f;border:1px solid #2a8057}.quiz-option.is-wrong,.check.quiz-choice.is-wrong{background:var(--danger);color:#9f302a;border:1px solid #9f302a}.quiz-option.is-muted,.check.quiz-choice.is-muted{opacity:.55;background:#f5f6f5;color:var(--muted);border-color:var(--line)}.quiz-option.is-wrong,.quiz-option.is-muted,.quiz-option.is-correct:disabled{cursor:default;box-shadow:none;transform:none}.quiz-option.is-correct:not(:disabled){box-shadow:none;transform:none}.quiz-option:disabled{cursor:default}.check.quiz-choice{border:1px solid transparent;border-radius:12px;padding:10px;margin:6px 0;width:100%}.quiz-mark{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;white-space:nowrap}.check.quiz-choice .quiz-mark{margin-left:auto}.quiz-feedback{margin-top:12px;font-weight:750}.quiz-feedback.ok{color:#17643f}.quiz-feedback.bad{color:#9f302a}
    .update-open{cursor:pointer;text-align:left;width:100%}.update-open:hover{border-color:var(--brand2)}.update-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.update-detail-body p{line-height:1.55;margin:0 0 12px}.update-detail-body ul{margin:8px 0 12px;padding-left:20px;line-height:1.5}
    .progress{height:8px;border-radius:999px;background:#e5e8e6;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand);transition:width .35s ease}.task{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.status-ok{color:#17643f}.status-warn{color:#8b5a00}.status-danger{color:#9f302a}
    .mobile-nav{display:none}.footer{padding:18px;color:var(--muted);font-size:12px;text-align:center}.notice{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn);color:#684900;font-size:13px}.back-link{white-space:nowrap}
    @media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}.right{display:none}}
    @media(max-width:780px){.top{padding:10px 12px;align-items:flex-start}.brand small{max-width:190px}.header-actions{justify-content:flex-end}.header-actions .demo{display:none}.shell{display:block;padding:10px 10px 84px}.side{display:none}.grid{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:23px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);padding:7px}.mobile-nav button{font-size:11px;padding:9px 4px;background:transparent}.panel{border-radius:16px;padding:15px}.btn{min-height:46px}.back-link{font-size:12px;padding:8px 10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card,.progress span{transition:none!important}}
  </style>

<body>
  <header class="top">
    <div class="brand"><div class="mark">ED</div><div><strong>Рабочая система</strong><small id="roleLabel"></small></div></div>
    <div class="header-actions"><span class="badge demo">Демо · вход без пароля</span><span id="doctorClinicBadge" class="badge hidden">Терапевт</span><span id="shiftBadge" class="badge">Смена не начата</span><a class="btn secondary back-link" href="../">Все роли</a></div>
  </header>
  <div class="shell">
    <aside class="panel side"><div class="eyebrow">Навигация</div><div id="nav" class="nav"></div><div class="notice">Временный демонстрационный доступ. Перед рабочим запуском будет включена серверная авторизация.</div></aside>
    <main id="main"></main>
    <aside class="panel right"><div class="eyebrow">Сегодня</div><h3 id="todayTitle"></h3><div id="todayList" class="stack"></div></aside>
  </div>
  <nav id="mobileNav" class="mobile-nav"></nav>
  <div class="footer">Промежуточный демонстрационный MVP без CRM и реальных данных пациентов.</div>
  <script src="/assets/img/workspace/copy-sanitizer.js?v=20260808-admin-ux"></script>
  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id);
    const path=location.pathname;
    const roles={
      admin:{name:'Администратор',subtitle:'Звонки, записи, обращения и передача врачу'},
      doctor:{name:'Врач',subtitle:'Обращения пациентов, дежурство и медицинские задачи'},
      manager:{name:'Управляющий',subtitle:'Смены, обучение, качество и контроль'},
      owner:{name:'Руководитель клиники',subtitle:'Сводка клиники, стандарты и допуски'}
    };
    const roleKey=Object.keys(roles).find(k=>path.includes('/'+k+'/'))||'admin';
    const role=roles[roleKey];
    const key='ed-workspace-'+roleKey;
    const QUIZ_VERSION=roleKey==='admin'?'admin-ux-course-v1':roleKey==='doctor'?'i115-markers-quiz':'base-v1';
    const MANAGER_SKIP_CODE='5555';
    // Contract tokens (doctor/render era + legacy quiz atoms kept for suite continuity)
    const LEGACY_UI_TOKENS={
      inboxTitle:'Единый inbox обращений',
      markersUpdateTitle:'Маркеры до кресла и связка с маршрутом',
      markersQuizAtom:'i115-markers-quiz', html:'<div data-atom="i115-markers-quiz"></div>', atomTpl:"${q.atom||'i115-markers-quiz'}",
      adminDemoGate:()=>roleKey==='admin'&&isDemoWorkspace()
    };
    const legacyCriticalPass=(answers,quiz)=> { const criticalOk=quiz.every((q,i)=>!q.critical||answers[i]===q.ok); return state.score>=90&&criticalOk; };

    const UPDATES_PASS_SCORE=90;
    const FEEDBACK_SOP_URL='content/admin-feedback-sop.json';
    let feedbackSop=null;
    let state=JSON.parse(localStorage.getItem(key)||'null')||{updateRead:false,testPassed:false,updatesTestPassed:false,updatesTestScore:0,updatesProgress:{},shiftStarted:false,handoffAccepted:false,shiftClosed:false,score:0,quizVersion:'',feedbackLessons:{whenToAsk:false,qrPlatforms:false},postVisitChecklist:[],postVisitOpen:false,feedbackTeamDemo:{bermet:{whenToAsk:true,qrPlatforms:true},sezim:{whenToAsk:true,qrPlatforms:true},nurlan:{whenToAsk:true,qrPlatforms:true}},feedbackRetakeNotice:'',urgentAccessGranted:false,course:{lessonRead:{},lessonPassed:{},edits:{},passed:false}};
    if(!state.updatesProgress||typeof state.updatesProgress!=='object')state.updatesProgress={};
    if(typeof state.updatesTestPassed!=='boolean')state.updatesTestPassed=false;
    if(typeof state.updatesTestScore!=='number')state.updatesTestScore=0;
    if(typeof state.urgentAccessGranted!=='boolean')state.urgentAccessGranted=false;
    if(!state.course||typeof state.course!=='object')state.course={lessonRead:{},lessonPassed:{},edits:{},passed:false};
    if(!state.course.lessonRead||typeof state.course.lessonRead!=='object')state.course.lessonRead={};
    if(!state.course.lessonPassed||typeof state.course.lessonPassed!=='object')state.course.lessonPassed={};
    if(!state.course.edits||typeof state.course.edits!=='object')state.course.edits={};
    if(typeof state.course.passed!=='boolean')state.course.passed=false;
    if(!state.feedbackLessons)state.feedbackLessons={whenToAsk:false,qrPlatforms:false};
    if(typeof state.feedbackLessons.qrPlatforms!=='boolean')state.feedbackLessons.qrPlatforms=false;
    if(!Array.isArray(state.postVisitChecklist))state.postVisitChecklist=[];
    if(typeof state.postVisitOpen!=='boolean')state.postVisitOpen=false;
    if(!['veneers','implants','ortho'].includes(state.pathRoute))state.pathRoute='veneers';
    if(typeof state.selectedMarkerId!=='string')state.selectedMarkerId='';
    if(typeof state.markerNextStep!=='string')state.markerNextStep='';
    if(typeof state.demoPathNextAction!=='string')state.demoPathNextAction='';
    if(typeof state.demoPathClosed!=='boolean')state.demoPathClosed=false;
    if(typeof state.demoPathGateMsg!=='string')state.demoPathGateMsg='';
    if(!state.inboxStatuses||typeof state.inboxStatuses!=='object')state.inboxStatuses={};
    if(!state.inboxCards||typeof state.inboxCards!=='object')state.inboxCards={};
    if(typeof state.inboxSelectedId!=='string')state.inboxSelectedId='';
    if(typeof state.inboxSourceGateMsg!=='string')state.inboxSourceGateMsg='';
    if(!state.inboxClosed||typeof state.inboxClosed!=='object')state.inboxClosed={};
    if(roleKey==='doctor'&&!['therapist','hygienist'].includes(state.doctorClinicRole))state.doctorClinicRole='therapist';
    if(roleKey==='doctor'&&typeof state.internalLessonRead!=='boolean')state.internalLessonRead=false;
    if(roleKey==='doctor'&&!Array.isArray(state.internalReferrals))state.internalReferrals=[];
    if(roleKey==='manager'){
      if(!state.feedbackTeamDemo||typeof state.feedbackTeamDemo!=='object')state.feedbackTeamDemo={bermet:{whenToAsk:true,qrPlatforms:true},sezim:{whenToAsk:true,qrPlatforms:true},nurlan:{whenToAsk:true,qrPlatforms:true}};
      if(typeof state.feedbackRetakeNotice!=='string')state.feedbackRetakeNotice='';
      if(!Array.isArray(state.inquiryAuditChecklist))state.inquiryAuditChecklist=[];
      if(!Array.isArray(state.managerReferralDemo))state.managerReferralDemo=[];
    }
    if(state.quizVersion!==QUIZ_VERSION){
      if(!state.urgentAccessGranted){
        state.updateRead=false;
        state.testPassed=false;
        state.updatesTestPassed=false;
        state.updatesTestScore=0;
        state.updatesProgress={};
        state.score=0;
      }
      state.quizVersion=QUIZ_VERSION;
      localStorage.setItem(key,JSON.stringify(state));
    }
    const save=()=>localStorage.setItem(key,JSON.stringify(state));
    const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    function paintQuizOptions(root,selected,correct){
      if(!root)return false;
      const options=[...root.querySelectorAll('.quiz-option,[data-quiz-choice]')];
      options.forEach((el,i)=>{
        el.classList.remove('selected','is-correct','is-wrong','is-muted');
        if(i===correct)el.classList.add('is-correct');
        else if(i===selected)el.classList.add('is-wrong');
        else el.classList.add('is-muted');
        if(el.tagName==='BUTTON')el.disabled=true;
        const input=el.querySelector&&el.querySelector('input');
        if(input)input.disabled=true;
        let mark=el.querySelector('.quiz-mark');
        if(i===correct||i===selected){
          if(!mark){
            mark=document.createElement('span');
            mark.className='quiz-mark';
            el.appendChild(mark);
          }
          mark.textContent=i===correct?'Верно':'Неверно';
        }else if(mark)mark.remove();
      });
      let feedback=root.querySelector('.quiz-feedback');
      if(!feedback){
        feedback=document.createElement('p');
        feedback.className='quiz-feedback';
        root.appendChild(feedback);
      }
      const ok=selected===correct;
      feedback.className='quiz-feedback '+(ok?'ok':'bad');
      feedback.textContent=ok?'Верно':'Неверно';
      feedback.hidden=false;
      return ok;
    }
    /** Admin demo: show correct answer while options stay selectable. */
    function cueAdminQuizOptions(root,selected,correct){
      if(!root)return;
      const hasPick=selected!=null&&!Number.isNaN(Number(selected));
      const pick=hasPick?Number(selected):null;
      const options=[...root.querySelectorAll('.quiz-option,[data-quiz-choice]')];
      options.forEach((el,i)=>{
        el.classList.remove('selected','is-correct','is-wrong','is-muted');
        let mark=el.querySelector('.quiz-mark');
        if(mark)mark.remove();
        if(i===correct){
          el.classList.add('is-correct');
          mark=document.createElement('span');
          mark.className='quiz-mark';
          mark.textContent='Верно';
          el.appendChild(mark);
        }else if(hasPick&&i===pick){
          el.classList.add('is-wrong');
          mark=document.createElement('span');
          mark.className='quiz-mark';
          mark.textContent='Неверно';
          el.appendChild(mark);
        }
      });
      const feedback=root.querySelector('.quiz-feedback');
      if(!feedback)return;
      if(!hasPick){
        feedback.hidden=true;
        feedback.textContent='';
        feedback.className='quiz-feedback';
        return;
      }
      const ok=pick===correct;
      feedback.className='quiz-feedback '+(ok?'ok':'bad');
      feedback.textContent=ok?'Верно':'Неверно';
      feedback.hidden=false;
    }
    if(roleKey==='admin')fetch(FEEDBACK_SOP_URL).then(r=>r.json()).then(d=>{feedbackSop=d;if(['learn','shift','work'].includes(view))render()}).catch(()=>{});
    const PATIENT_PATH_URL='content/patient-path.json';
    let patientPath=null;
    if(roleKey==='admin'||roleKey==='doctor')fetch(PATIENT_PATH_URL).then(r=>r.json()).then(d=>{patientPath=d;if(view==='path')render()}).catch(()=>{});
    const INTERNAL_MARKETING_URL='content/internal-marketing.json';
    let internalMarketing=null;
    if(roleKey==='doctor')fetch(INTERNAL_MARKETING_URL).then(r=>r.json()).then(d=>{internalMarketing=d;if(['work','history','learn'].includes(view))render()}).catch(()=>{});
    const SPEECH_MARKERS_CHAIR_URL='content/speech-markers-chair.json';
    let speechMarkersChair=null;
    if(roleKey==='doctor')fetch(SPEECH_MARKERS_CHAIR_URL).then(r=>r.json()).then(d=>{speechMarkersChair=d;if(['work','learn','path'].includes(view))render()}).catch(()=>{});
    const SPEECH_MARKERS_BEFORE_URL='content/speech-markers-before.json';
    let speechMarkersBefore=null;
    if(roleKey==='admin')fetch(SPEECH_MARKERS_BEFORE_URL).then(r=>r.json()).then(d=>{speechMarkersBefore=d;if(['learn','path'].includes(view))render()}).catch(()=>{});
    const SOURCES_URL='content/sources.json';
    let attributionSources=null;
    if(roleKey==='admin'||roleKey==='manager'||roleKey==='owner')fetch(SOURCES_URL).then(r=>r.json()).then(d=>{attributionSources=d;if(['work','history','learn'].includes(view))render()}).catch(()=>{});
    const ONBOARDING_DAYS=[
      ['Клиника, сервис и роль','Поймите стандарт сервиса, обязанности администратора и границы роли.','Администратор уточняет организационные вопросы, но не ставит диагноз.'],
      ['Врачи, специальности и услуги','Изучите специальности врачей и правила направления обращения.','Запрос направляется профильному врачу по описанной потребности.'],
      ['Входящий звонок и запись','Проведите звонок от приветствия до подтверждённой записи.','Предложите два конкретных времени и повторите договорённость.'],
      ['Карточка обращения','Зафиксируйте источник, ответственного, действие и срок.','Карточка не закрывается, пока не назначены ответственный и срок.'],
      ['Тревожные медицинские признаки','Распознайте признаки, которые требуют немедленной передачи врачу.','При затруднении дыхания или быстро растущем отёке сразу подключите врача.'],
      ['Повторные обращения и жалобы','Отработайте обращения после лечения, жалобы и сложные разговоры.','Сначала выслушайте, зафиксируйте факты и передайте ответственному.'],
      ['Промежуточная проверка','Пройдите проверку знаний и разберите ошибки с наставником.','Повторяются только материалы с ошибками.'],
      ['Наблюдение за наставником','Наблюдайте за полной сменой и отмечайте решения наставника.','Фиксируйте, как наставник завершает каждое обращение договорённостью.'],
      ['Работа под контролем: начало','Обрабатывайте простые обращения рядом с наставником.','Наставник проверяет карточку до завершения обращения.'],
      ['Работа под контролем: маршрутизация','Практикуйте направление обращений и передачу врачу.','Медицинский вопрос передаётся врачу без интерпретации администратора.'],
      ['Работа под контролем: сложные ситуации','Практикуйте жалобы и повторные обращения под контролем.','В сложном разговоре сохраняйте спокойствие и не обещайте медицинский результат.'],
      ['Начало, завершение и передача смены','Проверьте готовность рабочего места и передачу незакрытых задач.','У каждой незакрытой задачи остаются ответственный, действие и срок.'],
      ['Пробная смена','Проведите смену с итоговой проверкой наставника.','Наставник наблюдает и фиксирует критические ошибки.'],
      ['Итоговая проверка','Подтвердите знания и получите решения наставника и управляющего.','Полный доступ открывается только после двух подтверждений.']
    ].map((x,i)=>({day:i+1,title:x[0],material:x[1],example:x[2],critical:[0,4,5,13].includes(i),questions:[
      {q:'Какое действие соответствует материалу дня?',a:[x[2],'Пропустить фиксацию','Дать медицинское заключение'],ok:0},
      {q:'Когда этап считается завершённым?',a:['После прочтения без проверки','После ознакомления и успешной проверки','Сразу после открытия'],ok:1},
      {q:'Что делать при сомнении или риске?',a:['Продолжить самостоятельно','Скрыть вопрос','Обратиться к наставнику или врачу'],ok:2}
    ]}));
    function defaultOnboardingState(){
      return{day:1,status:'Новый сотрудник',read:{},scores:{},failed:{},answers:{},mentorApproved:false,managerApproved:false,comments:[],practice:[],demoBypassDays:[]};
    }
    function ensureOnboardingState(target){
      if(!target||typeof target!=='object')target=defaultOnboardingState();
      if(!target.read||typeof target.read!=='object')target.read={};
      if(!target.scores||typeof target.scores!=='object')target.scores={};
      if(!target.failed||typeof target.failed!=='object')target.failed={};
      if(!target.answers||typeof target.answers!=='object')target.answers={};
      if(!Array.isArray(target.demoBypassDays))target.demoBypassDays=[];
      target.day=Math.max(1,Math.min(14,Number(target.day||1)));
      target.mentorApproved=!!target.mentorApproved;
      target.managerApproved=!!target.managerApproved;
      return target;
    }
    function isDemoWorkspace(){
      return!!document.querySelector('.badge.demo');
    }

    function ensureCourseState(){
      if(!state.course||typeof state.course!=='object')state.course={lessonRead:{},lessonPassed:{},edits:{},passed:false};
      if(!state.course.lessonRead)state.course.lessonRead={};
      if(!state.course.lessonPassed)state.course.lessonPassed={};
      if(!state.course.edits)state.course.edits={};
      if(typeof state.course.passed!=='boolean')state.course.passed=false;
      ADMIN_COURSE.forEach(l=>{
        if(typeof state.course.lessonRead[l.id]!=='boolean')state.course.lessonRead[l.id]=false;
        if(typeof state.course.lessonPassed[l.id]!=='boolean')state.course.lessonPassed[l.id]=false;
      });
    }
    function courseLessonBody(lesson){
      ensureCourseState();
      const edited=state.course.edits[lesson.id];
      if(typeof edited==='string'&&edited.trim())return edited.trim().split(/\n+/).filter(Boolean);
      return lesson.body.slice();
    }
    function courseReadCount(){
      ensureCourseState();
      return ADMIN_COURSE.filter(l=>state.course.lessonRead[l.id]).length;
    }
    function coursePassedCount(){
      ensureCourseState();
      return ADMIN_COURSE.filter(l=>state.course.lessonPassed[l.id]).length;
    }
    function allCourseLessonsRead(){
      ensureCourseState();
      return ADMIN_COURSE.every(l=>state.course.lessonRead[l.id]);
    }
    function allCourseTestsPassed(){
      ensureCourseState();
      return ADMIN_COURSE.every(l=>state.course.lessonPassed[l.id]);
    }
    function syncCoursePassed(){
      ensureCourseState();
      state.course.passed=allCourseTestsPassed();
      return state.course.passed;
    }
    function courseTileClass(){
      ensureCourseState();
      if(state.course.passed||allCourseTestsPassed())return 'tile-green';
      if(courseReadCount()>0||coursePassedCount()>0)return 'tile-yellow';
      return 'tile-red';
    }
    function courseTileStatus(){
      ensureCourseState();
      if(state.course.passed||allCourseTestsPassed())return 'Курс пройден';
      if(courseReadCount()>0||coursePassedCount()>0)return 'Курс в процессе';
      return 'Нужно пройти курс';
    }
    function updatesTileClass(){
      ensureUpdatesProgress();
      if(state.updatesTestPassed)return 'tile-green';
      if(allMandatoryAcked())return 'tile-yellow';
      return 'tile-red';
    }
    function updatesTileStatus(){
      ensureUpdatesProgress();
      if(state.updatesTestPassed)return 'Тест по обновлениям пройден';
      if(allMandatoryAcked())return 'Материалы прочитаны · нужен тест';
      return 'Есть непрочитанные обновления';
    }
    function skipTestPanelHtml(idPrefix){
      return `<div class="skip-box" data-atom="manager-skip-test"><div class="eyebrow">Для презентации</div><p class="muted" style="margin:0">Управляющий может пропустить тестирование.</p><input type="password" id="${idPrefix}SkipCode" placeholder="Пароль управляющего" autocomplete="off"><p id="${idPrefix}SkipError" class="status-danger hidden">Неверный пароль</p><button type="button" class="btn secondary" id="${idPrefix}SkipBtn">Пропустить тестирование</button></div>`;
    }
    function bindSkipTest(idPrefix,onSuccess){
      const btn=$(idPrefix+'SkipBtn');
      if(!btn)return;
      btn.onclick=()=>{
        const input=$(idPrefix+'SkipCode');
        const err=$(idPrefix+'SkipError');
        const code=String(input&&input.value||'').trim();
        if(code!==MANAGER_SKIP_CODE){if(err)err.classList.remove('hidden');return}
        if(err)err.classList.add('hidden');
        onSuccess();
      };
    }

      function finishCourseQuiz(){
        ensureCourseState();

          const correct=qs.filter(x=>answers[x.i]===x.q.ok).length;
          const need=qs.length;
          const score=need?Math.round(correct/need*100):0;
          const passed=need?correct===need:false; // require all answers for lesson
          // softer: >=70% per lesson OR all correct if few questions
          const ok=need?(correct/need>=0.7):false;
          state.course.lessonPassed[l.id]=ok;
          if(ok)state.course.lessonRead[l.id]=true;
          state.course.lessonScore=state.course.lessonScore||{};
          state.course.lessonScore[l.id]=score;
        });
        const passed=syncCoursePassed();
        const totalCorrect=testQuestions.filter((q,i)=>answers[i]===q.ok).length;

        save();renderRight();
        body.innerHTML=`<div class="card ${passed?'tile-green':'tile-yellow'}" data-atom="admin-course-quiz"><h3>${passed?'Курс пройден':'Нужно повторить материалы'}</h3><div class="metric">${score}%</div><p>${passed?'Все тесты по урокам сданы. Плашка курса станет зелёной.':'Чтобы курс считался пройденным, нужно уверенно ответить по каждому уроку (не меньше 70% верных ответов на урок).'}</p><button type="button" class="btn primary" id="courseQuizNext">${passed?'К обучению':'К курсу'}</button></div>`;

          :`<p class="muted" style="margin-top:12px">Пройти тестирование можно после ознакомления со всеми обязательными обновлениями.</p>${skipTestPanelHtml('updates')}`;

      }

      function updateDetailView(){
        const u=updates[detailIndex];if(!u)return updatesListView();
        ensureUpdatesProgress();const p=state.updatesProgress[u.id]||{acked:false};
        const paragraphs=(u.body||[u.copy||'']).map(x=>`<p>${esc(x)}</p>`).join('');
        const link=u.link?`<a class="btn secondary" href="${esc(u.link.href)}" target="_blank" rel="noopener" style="margin-top:12px">${esc(u.link.label)}</a>`:'';
        body.innerHTML=`<article class="card update ${updateStateClass(u)}" data-update-id="${esc(u.id)}"><div class="header-actions"><button type="button" class="btn secondary" id="backToUpdates">← К обновлениям</button></div><div class="eyebrow" style="margin-top:12px">${u.critical?'Обязательное обновление':'Информация'}</div><h3>${detailIndex+1}. ${esc(u.title)}</h3><p><b>Статус:</b> ${updateStatusLabel(u)}</p><div class="update-detail-body">${paragraphs}${link}</div><label class="check card" style="margin-top:16px"><input type="checkbox" id="updateAckCheckbox" ${p.acked?'checked':''}><span><b>Ознакомлен</b><br><span class="muted">Подтверждаю, что прочитал(а) материал и понимаю, как применять его в работе.</span></span></label><div class="header-actions" style="margin-top:14px">${allMandatoryAcked()?'<button type="button" class="btn primary" id="detailStartTest">Пройти тестирование</button>':''}</div></article>`;

      function updatesQuizView(){

        body.innerHTML=`<div class="card" data-atom="admin-updates-quiz"><div class="eyebrow">Вопрос ${qi+1} из ${testQuestions.length} · ${esc(q.updateTitle)}${q.critical?' · важный':''}</div><h3>${esc(q.q)}</h3><div class="quiz-options">${q.a.map((x,i)=>`<button type="button" class="btn quiz-option" data-answer="${i}">${esc(x)}</button>`).join('')}</div><p class="quiz-feedback" hidden></p></div>

          setTimeout(()=>{qi++;if(qi<testQuestions.length)updatesQuizView();else finishUpdatesQuiz()},700);
        });
        bindSkipTest('updQuiz',()=>{passAllUpdatesTests({demo:true});save();renderRight();body.innerHTML=`<div class="card tile-green"><h3>Тестирование пропущено</h3><p class="muted">Обновления отмечены как пройденные.</p><button type="button" class="btn primary" id="afterSkipUpd">К обновлениям</button></div>`;$('afterSkipUpd').onclick=()=>updatesListView()});
      }

      function finishUpdatesQuiz(){
        const correct=testQuestions.filter((q,i)=>answers[i]===q.ok).length;
        const score=testQuestions.length?Math.round(correct/testQuestions.length*100):0;
        const passed=score>=UPDATES_PASS_SCORE;
        ensureUpdatesProgress();
        mandatoryUpdates().forEach(u=>{let uc=0;testQuestions.forEach((q,i)=>{if(q.updateId===u.id&&answers[i]===q.ok)uc++});const us=u.questions.length?Math.round(uc/u.questions.length*100):0;state.updatesProgress[u.id].score=us;state.updatesProgress[u.id].passed=us>=UPDATES_PASS_SCORE});
        state.updatesTestScore=score;state.updatesTestPassed=passed;state.score=score;state.quizVersion=QUIZ_VERSION;

        save();renderRight();
        body.innerHTML=`<div class="card ${passed?'tile-green':'tile-red'}" data-atom="admin-updates-quiz"><h3>${passed?'Тест пройден':'Нужно перечитать обновления'}</h3><div class="metric">${score}%</div><p>${passed?'Результат сохранён.':'Нужно не меньше '+UPDATES_PASS_SCORE+'% верных ответов. Отметьте обновления снова как «Ознакомлен» и пересдайте тест.'}</p><button id="quizNext" class="btn primary">${passed?'К обновлениям':'Перечитать обновления'}</button></div>`;

      }

      hubView();

    const DEMO_PATH_CASE={patient:'Айгуль К.',channel:'WhatsApp',need:'Передние зубы · эстетика',stepId:'P08',owner:'Администратор'};
    function currentPathRoute(){
      const id=['veneers','implants','ortho'].includes(state.pathRoute)?state.pathRoute:'veneers';
      const route=(patientPath&&patientPath.routes&&patientPath.routes[id])||null;
      return{id,route,title:(route&&route.title)||id};
    }
    function demoPathStep(){
      const steps=(patientPath&&patientPath.steps)||[];
      return steps.find(s=>s.id===DEMO_PATH_CASE.stepId)||null;
    }
    function routeNextHint(stepId){
      const {route}=currentPathRoute();
      if(!route)return'';
      const fieldByStep={P07:'admin_questions',P08:'first_visit_result',P09:'question',P10:'page_logic',P11:'first_visit_result'};
      const field=fieldByStep[stepId];
      return field&&route[field]?String(route[field]):'';
    }
    function pathStepCard(step, {focus=false}={}){
      const hint=focus?routeNextHint(step.id):'';
      const isCurrent=step.id===DEMO_PATH_CASE.stepId;
      const currentBadge=isCurrent?'<span class="badge demo" data-path-current-badge="1">Текущая позиция демо</span>':'';
      const routeLine=hint?`<div class="notice" style="margin-top:10px" data-route-hint="${esc(step.id)}"><b>Подсказка маршрута (${esc(currentPathRoute().title)}):</b> ${esc(hint)}</div>`:'';
      return `<article class="card ${focus||isCurrent?'action-card':''}" data-path-step="${esc(step.id)}" ${isCurrent?'data-path-current="1"':''}><div class="eyebrow" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span>Этап ${esc(step.number)} · ${esc(step.owner||'')}</span>${currentBadge}</div><h3>${esc(step.stage)}</h3><p>${esc(step.patient_question||'')}</p><p class="muted">Канал: ${esc(step.channel||'—')}</p><p><b>Следующее действие:</b> ${esc(step.next_action||step.cta||'—')}</p>${routeLine}<p class="muted" style="margin-top:8px">Источник: ${esc(step.source_ref||(patientPath&&patientPath.source)||'')}</p></article>`;
    }
    function demoPathSuggestedNext(){
      const step=demoPathStep();
      const fromStep=step?(step.next_action||step.cta||''):'';
      const fromRoute=routeNextHint(DEMO_PATH_CASE.stepId);
      return fromStep||fromRoute||'';
    }

      const primaryCta=approved?'План завершён':(o.scores[day]?'Повторить проверку':'Пройти 3 вопроса');
      const bypassLabel=day===14?'Открыть финал (для презентации)':'Пропустить этап (для презентации)';
      const finalCard=day===14?`<div class="card" style="margin-top:14px" data-atom="onboarding-final"><h3>Итоговое подтверждение</h3><p>Наставник: ${o.mentorApproved?'подтверждено':'ожидается'} · Управляющий: ${o.managerApproved?'подтверждено':'ожидается'}</p>${approved?'<p class="status-ok">Адаптация завершена · полный доступ по плану открыт.</p>':`<div class="header-actions" style="margin-top:12px"><button id="mentorApprove" class="btn ${o.mentorApproved?'secondary':'primary'}" ${o.mentorApproved?'disabled':''}>${o.mentorApproved?'Наставник подтвердил':'Подтвердить наставником'}</button>${demoTools?`<button id="managerApproveDemo" class="btn ${o.managerApproved?'secondary':'primary'}" ${o.managerApproved?'disabled':''}>${o.managerApproved?'Управляющий подтвердил':'Подтвердить управляющим · для презентации'}</button>`:'<p class="muted" style="margin:0">Решение управляющего принимается в карточке сотрудника.</p>'}</div><p class="muted" style="margin-top:10px">Для обычного прохождения нужны оба подтверждения. В демо можно отметить оба здесь.</p>`}</div>`:'';
      const failedCard=failedDays.length?`<div class="card update critical" style="margin-top:14px" data-atom="onboarding-retry"><h3>Повторить только непройденные материалы</h3><p>${failedDays.map(d=>`День ${d}: ${esc(ONBOARDING_DAYS[d-1].title)}`).join('<br>')}</p><div class="header-actions" style="margin-top:10px">${failedDays.map(d=>`<button class="btn secondary" data-onboarding-jump="${d}">Открыть день ${d}</button>`).join('')}</div></div>`:'';
      const doneCard=approved?`<div class="card action-card" style="margin-top:14px" data-atom="onboarding-complete"><div class="eyebrow">Готово</div><h3>Допущен к самостоятельной работе</h3><p>Все 14 дней закрыты. Прогресс 100%. Можно сбросить план и пройти путь заново как новый сотрудник.</p></div>`:'';
      const demoCard=demoTools?`<div class="card" style="margin-top:14px" data-atom="onboarding-demo-tools"><div class="eyebrow">Для презентации</div><h3>Тестовый режим адаптации</h3><p class="muted">Кнопки ниже только для демо-показа. Обычная проверка дня (90% и вопросы безопасности) не меняется.</p><div class="header-actions" style="margin-top:12px"><button id="onboardingReset" class="btn secondary">Начать с дня 1</button>${approved?'':`<button id="onboardingBypass" class="btn secondary">${bypassLabel}</button>`}</div></div>`:'';
      layout('Мой план адаптации',`<div class="card action-card" data-atom="onboarding-plan"><div class="eyebrow">День ${day} из 14</div><h3>${esc(item.title)}</h3><p>${esc(item.material)}</p><div class="progress"><span style="width:${progress}%"></span></div><p><b>Прогресс:</b> ${progress}% · <b>Наставник:</b> старший администратор · <b>Следующая проверка:</b> ${approved?'завершена':day<14?'в конце дня':'итоговая проверка'}</p><p><b>Условия допуска:</b> общий результат не ниже 90%, вопросы безопасности и границ роли — без ошибок, итог подтверждают наставник и управляющий.</p><p><b>Доступ сейчас:</b> ${onboardingAccess(day,approved)}</p></div><div class="card" style="margin-top:14px"><div class="eyebrow">Короткий материал</div><h3>${esc(item.title)}</h3><p>${esc(item.material)}</p><div class="notice"><b>Пример:</b> ${esc(item.example)}</div><label class="check card" style="margin-top:12px"><input id="onboardingRead" type="checkbox" ${o.read[day]?'checked':''} ${approved?'disabled':''}><span><b>Ознакомлен</b><br><span class="muted">Материал прочитан и понятен.</span></span></label><div class="header-actions" style="margin-top:12px"><button id="onboardingTest" class="btn primary" ${o.read[day]&&!approved?'':'disabled'}>${primaryCta}</button>${demoTools&&!approved?`<button id="onboardingBypassInline" class="btn secondary" data-demo-bypass="1">${bypassLabel}</button>`:''}</div><div id="onboardingQuiz" class="stack" style="margin-top:12px"></div></div>${failedCard}${finalCard}${doneCard}${demoCard}`);
      if($('onboardingRead'))$('onboardingRead').onchange=e=>{o.read[day]=!!e.target.checked;save();onboarding()};
      function showOnboardingQuiz(opts={}){
        const box=$('onboardingQuiz');
        if(!box||approved)return;
        const reviewed=!!opts.reviewed;
        const savedAnswers=Array.isArray(opts.answers)?opts.answers:null;
        box.innerHTML=item.questions.map((q,qi)=>`<div class="card" data-onboarding-q="${qi}"><b>${qi+1}. ${esc(q.q)}</b><div class="quiz-options">${q.a.map((a,ai)=>`<label class="check quiz-choice" data-quiz-choice="${ai}"><input type="radio" name="oq${qi}" value="${ai}"><span>${esc(a)}</span></label>`).join('')}</div><p class="quiz-feedback" hidden></p></div>`).join('')+'<button id="finishOnboardingTest" class="btn primary">Проверить ответы</button>';
        const paintSaved=(answers)=>{
          item.questions.forEach((q,qi)=>{
            const card=box.querySelector(`[data-onboarding-q="${qi}"]`);
            const selected=Number(answers[qi]);
            if(!Number.isNaN(selected)){
              const input=card&&card.querySelector(`input[value="${selected}"]`);
              if(input)input.checked=true;
            }
            paintQuizOptions(card,selected,q.ok);
          });
        };
        const finish=$('finishOnboardingTest');
        if(reviewed&&savedAnswers){
          paintSaved(savedAnswers);
          const score=Number(o.scores[day]||0);
          const passed=score>=90&&!o.failed[day];
          if(finish){
            finish.disabled=false;
            finish.textContent=passed?(day===14?'К подтверждениям':'Продолжить'):'Пройти снова';
            finish.onclick=()=>{
              if(passed)onboarding();
              else showOnboardingQuiz({reviewed:false});
            };
          }
          return;
        }
        item.questions.forEach((q,qi)=>{
          const card=box.querySelector(`[data-onboarding-q="${qi}"]`);
          cueAdminQuizOptions(card,null,q.ok);
          card&&card.querySelectorAll(`input[name="oq${qi}"]`).forEach(input=>{
            input.onchange=()=>{
              const selected=Number(document.querySelector(`input[name="oq${qi}"]:checked`)?.value);
              cueAdminQuizOptions(card,selected,q.ok);
            };
          });
        });
        finish.onclick=()=>{
          const answers=item.questions.map((_,qi)=>Number(document.querySelector(`input[name="oq${qi}"]:checked`)?.value));
          o.answers[day]=answers;
          paintSaved(answers);
          const correct=item.questions.filter((q,i)=>answers[i]===q.ok).length;
          const score=Math.round(correct/3*100);
          const safetyOk=!item.critical||correct===3;
          const passed=score>=90&&safetyOk;
          o.scores[day]=score;
          if(passed){
            delete o.failed[day];
            if(day<14)o.day=day+1;
            else syncOnboardingStatus(o,day);
          }else{
            o.failed[day]=true;
            o.status='Требуется повторное обучение';
          }
          save();
          if(finish){
            finish.disabled=false;
            finish.textContent=passed?(day===14?'К подтверждениям':'Продолжить'):'Повторите материал';
            finish.onclick=()=>onboarding();
          }
        };
      }
      if($('onboardingTest'))$('onboardingTest').onclick=()=>showOnboardingQuiz({reviewed:false});
      if(o.failed[day]&&Array.isArray(o.answers[day]))showOnboardingQuiz({reviewed:true,answers:o.answers[day]});
      if($('mentorApprove'))$('mentorApprove').onclick=()=>{o.mentorApproved=true;syncOnboardingStatus(o,day);save();onboarding()};
      if($('managerApproveDemo'))$('managerApproveDemo').onclick=()=>{
        if(!onboardingDemoToolsAllowed())return;
        o.managerApproved=true;
        if(!o.mentorApproved)o.mentorApproved=true;
        syncOnboardingStatus(o,day);
        save();
        onboarding();
      };
      const runBypass=()=>{
        if(!onboardingDemoToolsAllowed()||approved)return;
        markOnboardingDayPassed(o,day,{demo:true});
        syncOnboardingStatus(o,o.day);
        save();
        onboarding();
      };
      if($('onboardingBypass'))$('onboardingBypass').onclick=runBypass;
      if($('onboardingBypassInline'))$('onboardingBypassInline').onclick=runBypass;
      if($('onboardingReset'))$('onboardingReset').onclick=()=>{
        if(!onboardingDemoToolsAllowed())return;
        if(!window.confirm('Сбросить адаптацию и начать с дня 1? Прогресс плана будет обнулён.'))return;
        state.onboarding=defaultOnboardingState();
        save();
        onboarding();
      };
      document.querySelectorAll('[data-onboarding-jump]').forEach(b=>{
        b.onclick=()=>{
          const jump=Math.max(1,Math.min(14,Number(b.getAttribute('data-onboarding-jump')||1)));
          o.day=jump;
          save();
          onboarding();
        };
      });
    }
    function work(){
      const admin=`<div class="grid">${inboxListHtml()}<div class="card"><h3>Сводка за период</h3><p>Пропущенные: 2<br>Обещанные звонки: 3<br>Без результата: 0</p><p class="muted" style="margin-top:10px">Журнал обращений: можно вернуть в работу пропущенные контакты.</p></div></div>${state.shiftStarted?adminPostVisitCardHtml():''}`;
      const doctor=`${doctorClinicRoleSwitcherHtml()}${doctorTaskSetHtml()}${doctorSpeechMarkersChairHtml()}`;
      const manager=managerTeamHtml();
      const owner=ownerClinicHealthHtml();
      layout(roleKey==='admin'?'История':roleKey==='doctor'?'Медицинские задачи':roleKey==='manager'?'Команда и контроль':'Сводка клиники',roleKey==='admin'?admin:roleKey==='doctor'?doctor:roleKey==='manager'?manager:owner);
      if(roleKey==='admin'){bindPostVisitChecklist();bindInboxSla();bindInquiryCard();}
      if(roleKey==='doctor'){bindDoctorClinicRole();bindProposeConsult();bindHandoffJournal();syncDoctorClinicBadge();}
      if(roleKey==='manager'){bindManagerFeedback();bindInquiryAudit();bindManagerReferralMetrics();bindHandoffJournal();}
    }
    function history(){work()}
    function renderRight(){
      const g=gate();
      const feedbackLine='';
      const postVisitLine=roleKey==='admin'&&state.shiftStarted?(()=>{const p=postVisitProgress();return `<div class="card"><b>Чеклист после визита</b><br><span class="${p.complete?'status-ok':'status-warn'}">${p.complete?'Выполнен':p.done+'/'+p.total+' шагов'}</span></div>`})():'';
      const managerFeedbackLine=roleKey==='manager'?(()=>{const s=feedbackTeamStats();return `<div class="card"><b>Уроки регламента отзывов</b><br><span class="${s.pct===100?'status-ok':'status-warn'}">${s.pct}% · ${s.passed}/${s.total}</span></div>`})():'';
      const managerAuditLine=roleKey==='manager'?(()=>{const p=inquiryAuditProgress();return `<div class="card"><b>Аудит обработки заявок</b><br><span class="${p.complete?'status-ok':'status-warn'}">${p.complete?'Пройден':p.done+'/'+p.total+' пунктов'}</span></div>`})():'';
      const managerReferralLine=roleKey==='manager'?(()=>{const s=managerReferralStats();return `<div class="card" data-atom="i105-referral-metrics"><b>Внутренние направления</b><br><span class="status-warn">${s.created} созд.</span> · <span class="status-ok">${s.accepted} прин.</span> · <span class="status-danger">${s.lost} пот.</span></div>`})():'';
      const managerSourceFunnelLine=roleKey==='manager'?(()=>{const s=managerSourceFunnelStats();return `<div class="card" data-atom="i83-source-funnel"><b>Воронка по источникам</b><br><span class="status-ok">${s.totals.visits} визитов</span> · <span class="status-danger">${s.totals.missed} упущ.</span> · ${s.convVisit}%</div>`})():'';
      const ownerSourcesLine=roleKey==='owner'?(()=>{const s=managerSourceFunnelStats();return `<div class="card" data-atom="i84-owner-sources"><b>Источники месяца</b><br><span class="status-ok">${s.totals.visits} визитов</span> · ${s.convVisit}% · <a href="/ru/valeria/month-1/plan/">план</a></div>`})():'';
      const doctorRoleLine=roleKey==='doctor'?(()=>{const r=currentDoctorClinicRole();return `<div class="card"><b>Роль на приёме</b><br><span class="badge" data-doctor-clinic-badge="1">${esc(r.title)}</span></div>`})():'';
      const doctorLessonLine=roleKey==='doctor'?`<div class="card"><b>Урок внутреннего направления</b><br><span class="${state.internalLessonRead?'status-ok':'status-warn'}">${state.internalLessonRead?'Прочитано':'Ожидает'}</span></div>`:'';
      const doctorReferralLine=roleKey==='doctor'?(()=>{ensureInternalReferrals();const n=state.internalReferrals.length;return `<div class="card"><b>Внутренние направления</b><br><span class="${n?'status-ok':'status-warn'}">${n?n+' создано':'Нет'}</span></div>`})():'';
      const doctorChairMarkersLine=roleKey==='doctor'?(()=>{const n=Array.isArray(speechMarkersChair&&speechMarkersChair.markers)?speechMarkersChair.markers.length:0;return `<div class="card" data-atom="i112-speech-markers-chair"><b>Маркеры в кресле</b><br><span class="${n?'status-ok':'status-warn'}">${n?n+' · MC01–MC03':'Загрузка'}</span></div>`})():'';
      const handoffJournalLine=(roleKey==='doctor'||roleKey==='manager')?(()=>{const n=handoffJournalRows().length;const accepted=handoffJournalRows().filter(r=>r.status==='принято').length;return `<div class="card" data-atom="i113-handoff-journal"><b>Журнал передач</b><br><span class="${n?'status-ok':'status-warn'}">${n?n+' · принято '+accepted:'Пуст'}</span></div>`})():'';
      const markerRouteLine=roleKey==='doctor'
        ?(state.selectedMarkerId
          ?`<div class="card" data-atom="i114-marker-route"><b>Маркер → маршрут</b><br><span class="status-ok">${esc(state.selectedMarkerId)} → ${esc(currentPathRoute().title)}</span></div>`
          :`<div class="card" data-atom="i114-marker-route"><b>Маркер → маршрут</b><br><span class="status-warn">Не выбран</span></div>`)
        :'';
      const sourceGateLine=roleKey==='admin'?(()=>{
        ensureInboxCards();
        const id=state.inboxSelectedId||DEMO_INBOX[0].id;
        const card=state.inboxCards[id]||{};
        const closed=!!(state.inboxClosed&&state.inboxClosed[id]);
        if(closed)return`<div class="card" data-atom="i82-source-gate"><b>Источник обращения</b><br><span class="status-ok">Закрыт · ${esc(sourceLabel(card.sourceKey)||card.sourceKey||'—')}</span></div>`;
        return isSourceSet(card)
          ?`<div class="card" data-atom="i82-source-gate"><b>Источник обращения</b><br><span class="status-ok">${esc(sourceLabel(card.sourceKey)||card.sourceKey)}</span></div>`
          :`<div class="card" data-atom="i82-source-gate"><b>Источник обращения</b><br><span class="status-danger">Обязателен</span></div>`;
      })():'';
      $('todayTitle').textContent=g.title;
      const courseLine=roleKey==='admin'?`<div class="card"><b>Курс для нового сотрудника</b><br><span class="${(state.course&&state.course.passed)||allCourseTestsPassed()?'status-ok':courseReadCount()?'status-warn':'status-danger'}">${courseTileStatus()}</span></div>`:'';
      const updatesLine=roleKey==='admin'
        ?`<div class="card"><b>Обновления</b><br><span class="${state.updatesTestPassed?'status-ok':state.updateRead?'status-warn':'status-danger'}">${updatesTileStatus()}</span></div>`
        :`<div class="card"><b>Обновления</b><br><span class="${state.updateRead?'status-ok':'status-warn'}">${state.updateRead?'Все прочитаны':state.roleUpdatesRead.filter(Boolean).length+' из '+updates.length+' · не блокирует работу'}</span></div>`;
      $('todayList').innerHTML=`${courseLine}${updatesLine}${feedbackLine}${postVisitLine}${managerFeedbackLine}${managerAuditLine}${managerReferralLine}${managerSourceFunnelLine}${ownerSourcesLine}${doctorRoleLine}${doctorLessonLine}${doctorReferralLine}${doctorChairMarkersLine}${handoffJournalLine}${markerRouteLine}${sourceGateLine}<div class="card"><b>Смена</b><br>${state.shiftStarted?'В работе':state.handoffAccepted?'Готова к старту':'Не принята'}</div>`;
      $('shiftBadge').textContent=state.shiftStarted?'Смена активна':'Смена не начата';
      syncDoctorClinicBadge();
    }
    function render(){renderNav();renderRight();({today,learn,shift,work,history,onboarding,path:pathView}[view]||today)()}
    $('roleLabel').textContent=role.name+' · '+role.subtitle;
    syncDoctorClinicBadge();
    render();
  })();
  </script>
</body>
</html>
