# VPS2402 origin — Expert Dental Studio patient site (clinic.raimovdental.com).
#
# Preview surface for the clinic's public website. It shares the raimovdental.com zone
# and nothing else: no auth gate, no /ru/ strategy atlas, its own webroot.
# Routes match the future expertdental.kg exactly, so the cutover is a DNS change plus a
# server_name swap rather than a rebuild.
#
# Installed by scripts/raimov/deploy-patient-site.sh — do not edit on the server.

server {
    listen 185.216.214.28:80;
    listen 80;
    server_name clinic.raimovdental.com;
    charset utf-8;

    root /var/www/clinic.raimovdental.com/current;

    # Renewal webroot sits outside the release directory, which deploys replace wholesale.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/clinic.raimovdental.com/acme;
        try_files $uri =404;
    }
    location / { return 301 https://clinic.raimovdental.com$request_uri; }
}

server {
    listen 185.216.214.28:443 ssl http2;
    listen 443 ssl http2;
    server_name clinic.raimovdental.com;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/clinic.raimovdental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.raimovdental.com/privkey.pem;

    root /var/www/clinic.raimovdental.com/current;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Preview surface: keep it out of search results even if robots.txt is ignored.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Legacy Tilda URLs and consolidated service slugs, generated by the builder.
    include /etc/nginx/snippets/clinic-raimovdental-redirects.conf;

    location ^~ /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # Build report for the clinic — reachable by direct link, never indexed or listed.
    location ^~ /internal/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Review Hub (expert-feedback-hub.service) — the only dynamic surface on this host.
    # It owns /feedback/* and nothing else, so the static site keeps serving every other
    # route even when the hub is stopped. If the service is down the patient gets a plain
    # 502 on that prefix rather than a broken clinic site.
    location ^~ /feedback/ {
        proxy_pass http://127.0.0.1:8613;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        # Per-patient state: never cached by nginx or by the edge.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /feedback { return 301 https://$host/feedback/; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
