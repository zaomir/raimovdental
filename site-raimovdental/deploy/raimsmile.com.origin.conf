# VPS2402 origin — RAIM SMILE SYSTEM product landing (raimsmile.com).
# Canon: docs/ssot/RAIM_SMILE_SYSTEM.md · DEC-801
# Keep noindex until medical/legal gates close.

server {
    listen 185.216.214.28:80;
    listen 80;
    server_name raimsmile.com www.raimsmile.com;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/raimsmile.com/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://raimsmile.com$request_uri;
    }
}

server {
    listen 185.216.214.28:443 ssl http2;
    listen 443 ssl http2;
    server_name raimsmile.com www.raimsmile.com;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/raimsmile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raimsmile.com/privkey.pem;

    root /var/www/raimsmile.com;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
