<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Expert Dental · Рабочая система</title>
  <style>
    :root{--bg:#f3f2ee;--card:#fff;--ink:#17322d;--muted:#697873;--line:#d9dedb;--brand:#174d43;--brand2:#23685a;--soft:#eaf2ef;--warn:#fff5dc;--danger:#ffe9e6;--ok:#e8f5ee;--shadow:0 18px 50px rgba(23,50,45,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.hidden{display:none!important}
    .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px}.brand small{display:block;color:var(--muted)}.mark{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:850;box-shadow:0 10px 24px rgba(23,77,67,.2)}
    .header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.badge{display:inline-flex;border-radius:999px;padding:7px 10px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:750}.badge.demo{background:var(--warn);color:#7a5200}
    .btn{border:0;border-radius:13px;padding:12px 16px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .16s ease,box-shadow .2s ease,background .2s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.985)}.primary{background:var(--brand);color:#fff;box-shadow:0 9px 22px rgba(23,77,67,.18)}.secondary{background:#eef1ef;color:var(--ink)}.danger{background:#9f302a;color:#fff}
    .shell{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
    .nav button{width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--ink);box-shadow:none}.nav button.active{background:var(--soft);color:var(--brand)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
    .hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{margin:6px 0 8px;font-size:28px}.hero p{max-width:720px}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.card{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff;transition:transform .18s ease,box-shadow .22s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,50,45,.08)}.card h3{margin:0 0 7px}.metric{font-size:26px;font-weight:850}.action-card{border:2px solid var(--brand);background:linear-gradient(180deg,#fff,var(--soft))}
    .stack{display:grid;gap:10px}.update{border-left:4px solid var(--brand)}.update.critical{border-left-color:#9f302a;background:var(--danger)}.check{display:flex;align-items:flex-start;gap:10px}.check input{margin-top:3px}.quiz-option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;margin:6px 0}.quiz-option.selected{background:var(--brand);color:#fff;border-color:var(--brand)}
    .progress{height:8px;border-radius:999px;background:#e5e8e6;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand);transition:width .35s ease}.task{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.status-ok{color:#17643f}.status-warn{color:#8b5a00}.status-danger{color:#9f302a}
    .mobile-nav{display:none}.footer{padding:18px;color:var(--muted);font-size:12px;text-align:center}.notice{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warn);color:#684900;font-size:13px}.back-link{white-space:nowrap}
    @media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}.right{display:none}}
    @media(max-width:780px){.top{padding:10px 12px;align-items:flex-start}.brand small{max-width:190px}.header-actions{justify-content:flex-end}.header-actions .demo{display:none}.shell{display:block;padding:10px 10px 84px}.side{display:none}.grid{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:23px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);padding:7px}.mobile-nav button{font-size:11px;padding:9px 4px;background:transparent}.panel{border-radius:16px;padding:15px}.btn{min-height:46px}.back-link{font-size:12px;padding:8px 10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card,.progress span{transition:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><div class="mark">ED</div><div><strong>Рабочая система</strong><small id="roleLabel"></small></div></div>
    <div class="header-actions"><span class="badge demo">Демо · вход без пароля</span><span id="shiftBadge" class="badge">Смена не начата</span><a class="btn secondary back-link" href="../">Все роли</a></div>
  </header>
  <div class="shell">
    <aside class="panel side"><div class="eyebrow">Навигация</div><div id="nav" class="nav"></div><div class="notice">Временный демонстрационный доступ. Перед рабочим запуском будет включена серверная авторизация.</div></aside>
    <main id="main"></main>
    <aside class="panel right"><div class="eyebrow">Сегодня</div><h3 id="todayTitle"></h3><div id="todayList" class="stack"></div></aside>
  </div>
  <nav id="mobileNav" class="mobile-nav"></nav>
  <div class="footer">Промежуточный демонстрационный MVP без CRM и реальных данных пациентов.</div>
  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id);
    const path=location.pathname;
    const roles={
      admin:{name:'Администратор',subtitle:'Звонки, записи, обращения и передача врачу'},
      doctor:{name:'Врач',subtitle:'Обращения пациентов, дежурство и медицинские задачи'},
      manager:{name:'Управляющий',subtitle:'Смены, обучение, качество и контроль'},
      owner:{name:'Руководитель клиники',subtitle:'Сводка клиники, стандарты и допуски'}
    };
    const roleKey=Object.keys(roles).find(k=>path.includes('/'+k+'/'))||'admin';
    const role=roles[roleKey];
    const key='ed-workspace-'+roleKey;
    const QUIZ_VERSION=roleKey==='admin'?'i54-feedback-quiz':'base-v1';
    const FEEDBACK_SOP_URL='content/admin-feedback-sop.json';
    let feedbackSop=null;
    let state=JSON.parse(localStorage.getItem(key)||'null')||{updateRead:false,testPassed:false,shiftStarted:false,handoffAccepted:false,shiftClosed:false,score:0,quizVersion:'',feedbackLessons:{whenToAsk:false,qrPlatforms:false},postVisitChecklist:[],postVisitOpen:false,feedbackTeamDemo:{bermet:{whenToAsk:true,qrPlatforms:true},sezim:{whenToAsk:true,qrPlatforms:true},nurlan:{whenToAsk:true,qrPlatforms:true}},feedbackRetakeNotice:''};
    if(!state.feedbackLessons)state.feedbackLessons={whenToAsk:false,qrPlatforms:false};
    if(typeof state.feedbackLessons.qrPlatforms!=='boolean')state.feedbackLessons.qrPlatforms=false;
    if(!Array.isArray(state.postVisitChecklist))state.postVisitChecklist=[];
    if(typeof state.postVisitOpen!=='boolean')state.postVisitOpen=false;
    if(!['veneers','implants','ortho'].includes(state.pathRoute))state.pathRoute='veneers';
    if(typeof state.demoPathNextAction!=='string')state.demoPathNextAction='';
    if(typeof state.demoPathClosed!=='boolean')state.demoPathClosed=false;
    if(typeof state.demoPathGateMsg!=='string')state.demoPathGateMsg='';
    if(!state.inboxStatuses||typeof state.inboxStatuses!=='object')state.inboxStatuses={};
    if(!state.inboxCards||typeof state.inboxCards!=='object')state.inboxCards={};
    if(typeof state.inboxSelectedId!=='string')state.inboxSelectedId='';
    if(roleKey==='manager'){
      if(!state.feedbackTeamDemo||typeof state.feedbackTeamDemo!=='object')state.feedbackTeamDemo={bermet:{whenToAsk:true,qrPlatforms:true},sezim:{whenToAsk:true,qrPlatforms:true},nurlan:{whenToAsk:true,qrPlatforms:true}};
      if(typeof state.feedbackRetakeNotice!=='string')state.feedbackRetakeNotice='';
    }
    if(state.quizVersion!==QUIZ_VERSION){
      state.updateRead=false;
      state.testPassed=false;
      state.score=0;
      state.quizVersion=QUIZ_VERSION;
      localStorage.setItem(key,JSON.stringify(state));
    }
    const save=()=>localStorage.setItem(key,JSON.stringify(state));
    const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    if(roleKey==='admin')fetch(FEEDBACK_SOP_URL).then(r=>r.json()).then(d=>{feedbackSop=d;if(['learn','shift','work'].includes(view))render()}).catch(()=>{});
    const PATIENT_PATH_URL='content/patient-path.json';
    let patientPath=null;
    if(roleKey==='admin'||roleKey==='doctor')fetch(PATIENT_PATH_URL).then(r=>r.json()).then(d=>{patientPath=d;if(view==='path')render()}).catch(()=>{});
    function ensurePostVisitState(){
      if(!Array.isArray(state.postVisitChecklist))state.postVisitChecklist=[];
      const len=(feedbackSop&&feedbackSop.post_visit_checklist||[]).length||5;
      while(state.postVisitChecklist.length<len)state.postVisitChecklist.push(false);
    }
    function postVisitProgress(){
      ensurePostVisitState();
      const total=state.postVisitChecklist.length;
      const done=state.postVisitChecklist.filter(Boolean).length;
      return {done,total,complete:total>0&&done===total};
    }
    function adminPostVisitCardHtml(){
      if(roleKey!=='admin'||!state.shiftStarted)return '';
      ensurePostVisitState();
      const steps=(feedbackSop&&feedbackSop.post_visit_checklist)||[];
      const prog=postVisitProgress();
      const demo={patient:'Айгуль К.',service:'Консультация · виниры',doctor:'доктор Нурбеков'};
      if(!steps.length)return `<div class="card action-card" data-atom="i53-post-visit"><div class="eyebrow">После визита · демо</div><h3>Визит состоялся</h3><p class="muted">${esc(demo.patient)} · ${esc(demo.service)} · ${esc(demo.doctor)}</p><p class="muted">Загрузка чеклиста регламента…</p></div>`;
      const checklist=state.postVisitOpen?`<div id="postVisitChecklist" class="stack" style="margin-top:14px">${steps.map((s,i)=>`<label class="check card ${state.postVisitChecklist[i]?'':'update'}"><input type="checkbox" data-checklist-step="${i}" ${state.postVisitChecklist[i]?'checked':''}><span><b>${esc(s.step)}</b><br>${esc(s.action)}<br><span class="muted">${esc(s.restriction)}</span></span></label>`).join('')}<p class="muted">Источник: admin-feedback-sop.json · post_visit_checklist</p></div>`:'';
      const btn=state.postVisitOpen?'':`<button id="openPostVisitChecklist" class="btn primary" style="margin-top:12px">Открыть чеклист запроса отзыва</button>`;
      const status=prog.complete?'<p class="status-ok" style="margin-top:12px">✓ Чеклист выполнен</p>':prog.done>0?`<p class="status-warn" style="margin-top:12px">${prog.done} из ${prog.total} шагов</p>`:'';
      return `<div class="card action-card" data-atom="i53-post-visit"><div class="eyebrow">После визита · демо</div><h3>Визит состоялся</h3><p><b>${esc(demo.patient)}</b><br>${esc(demo.service)} · ${esc(demo.doctor)}</p><p class="muted">Обязательное действие после завершённого визита — пройти чеклист запроса отзыва по регламенту.</p>${status}${btn}${checklist}</div>`;
    }
    const FEEDBACK_TEAM=[
      {id:'aizhan',name:'Администратор Айжан',shift:'В работе',shiftClass:'status-ok',liveAdmin:true},
      {id:'bermet',name:'Администратор Бермет',shift:'Смена закрыта',shiftClass:'muted'},
      {id:'sezim',name:'Администратор Сезим',shift:'В работе',shiftClass:'status-ok'},
      {id:'nurlan',name:'Администратор Нурлан',shift:'Тест просрочен',shiftClass:'status-warn'}
    ];
    function readLiveAdminFeedback(){
      try{
        const s=JSON.parse(localStorage.getItem('ed-workspace-admin')||'null');
        if(!s||!s.feedbackLessons)return {whenToAsk:false,qrPlatforms:false};
        return {whenToAsk:!!s.feedbackLessons.whenToAsk,qrPlatforms:!!s.feedbackLessons.qrPlatforms};
      }catch{return {whenToAsk:false,qrPlatforms:false}}
    }
    function staffFeedbackProgress(member){
      if(member.liveAdmin)return readLiveAdminFeedback();
      const d=(state.feedbackTeamDemo&&state.feedbackTeamDemo[member.id])||{whenToAsk:false,qrPlatforms:false};
      return {whenToAsk:!!d.whenToAsk,qrPlatforms:!!d.qrPlatforms};
    }
    function feedbackLessonsComplete(p){return p.whenToAsk&&p.qrPlatforms}
    function feedbackTeamStats(){
      const rows=FEEDBACK_TEAM.map(m=>({member:m,progress:staffFeedbackProgress(m)}));
      const passed=rows.filter(r=>feedbackLessonsComplete(r.progress)).length;
      const total=rows.length;
      const pct=total?Math.round(passed/total*100):0;
      return {rows,passed,total,pct};
    }
    function feedbackLessonLabel(p){
      if(feedbackLessonsComplete(p))return '<b class="status-ok">Уроки пройдены</b>';
      if(p.whenToAsk||p.qrPlatforms)return '<b class="status-warn">Частично</b>';
      return '<b class="status-danger">Не пройдены</b>';
    }
    function resetStaffFeedbackRetake(member){
      if(member.liveAdmin){
        try{
          const s=JSON.parse(localStorage.getItem('ed-workspace-admin')||'null')||{};
          s.feedbackLessons={whenToAsk:false,qrPlatforms:false};
          s.testPassed=false;
          s.score=0;
          s.updateRead=false;
          s.quizVersion='';
          localStorage.setItem('ed-workspace-admin',JSON.stringify(s));
        }catch{}
        return;
      }
      if(!state.feedbackTeamDemo)state.feedbackTeamDemo={};
      state.feedbackTeamDemo[member.id]={whenToAsk:false,qrPlatforms:false};
    }
    function assignFeedbackRetake(){
      const pending=FEEDBACK_TEAM.filter(m=>!feedbackLessonsComplete(staffFeedbackProgress(m)));
      pending.forEach(resetStaffFeedbackRetake);
      const n=pending.length;
      state.feedbackRetakeNotice=n?`Пересдача назначена: ${n} ${n===1?'сотруднику':n<5?'сотрудникам':'сотрудникам'}. Уроки и тест регламента отзывов сброшены.`:'Все администраторы уже прошли уроки регламента отзывов.';
      save();
      work();
      renderRight();
    }
    function managerTeamHtml(){
      const stats=feedbackTeamStats();
      const teamRows=stats.rows.map(({member,progress})=>`<div class="task" data-staff="${member.id}"><span>${esc(member.name)}<br><span class="muted">Регламент отзывов · ${progress.whenToAsk?'урок 1 ✓':'урок 1 —'} · ${progress.qrPlatforms?'урок 2 ✓':'урок 2 —'}</span></span>${feedbackLessonLabel(progress)}</div>`).join('')+
        `<div class="task"><span>Доктор Нурбеков</span><b class="status-ok">Свободен</b></div><div class="task"><span>Доктор Абдыкадырова</span><b class="status-warn">Тест просрочен</b></div>`;
      const notice=state.feedbackRetakeNotice?`<p class="status-ok" style="margin-top:12px">${esc(state.feedbackRetakeNotice)}</p>`:'';
      const pending=stats.total-stats.passed;
      return `<div class="grid"><div class="card"><h3>Команда сегодня</h3>${teamRows}</div><div class="card" data-atom="i55-manager-feedback"><div class="eyebrow">Контроль · регламент отзывов</div><h3>Обучение администраторов</h3><div class="metric">${stats.pct}%</div><p class="muted">${stats.passed} из ${stats.total} администраторов прошли оба урока «Когда просить отзыв» и «QR и три площадки»</p>${pending?`<p class="status-warn">${pending} ожидают пересдачи</p>`:'<p class="status-ok">Все прошли уроки</p>'}${notice}<button id="assignFeedbackRetake" class="btn primary" style="margin-top:12px">Назначить пересдачу</button></div></div>`;
    }
    function bindManagerFeedback(){
      if($('assignFeedbackRetake'))$('assignFeedbackRetake').onclick=assignFeedbackRetake;
    }
    function bindPostVisitChecklist(){
      ensurePostVisitState();
      if($('openPostVisitChecklist'))$('openPostVisitChecklist').onclick=()=>{state.postVisitOpen=true;save();({shift,work}[view]||shift)()};
      document.querySelectorAll('[data-checklist-step]').forEach(el=>{
        const i=Number(el.dataset.checklistStep);
        el.onchange=()=>{state.postVisitChecklist[i]=el.checked;save();({shift,work}[view]||shift)();renderRight()};
      });
    }
    const updatesBase=[
      {title:'Новая маршрутизация медицинского обращения',critical:true,copy:'Система сначала предлагает лечащего врача, затем свободного врача нужной специальности и дежурного. Ответственность передаётся только после принятия врачом.'},
      {title:'Пошаговый опросник передачи врачу',critical:true,copy:'Каждый обязательный вопрос открывается отдельно. Выбор ответа сохраняется и автоматически переводит на следующий шаг.'},
      {title:'Начало и сдача смены',critical:false,copy:'Перед началом работы нужно прочитать обновления, принять передачу и подтвердить готовность. В конце смены все незакрытые задачи получают владельца и срок.'}
    ];
    const updatesAdmin=[
      {title:'Каталог 25 скриптов администратора',critical:true,copy:'В модуле /render/ открывается каталог scripts-25.json: цель, текст, следующий шаг и «чего не говорить». Карточка скрипта обязательна при цене и страхах (S05, S08 и соседние).'},
      {title:'9 правил повторных касаний',critical:true,copy:'Экран «Повторные касания» показывает правила из recontact-9.json. Из правила создаётся демо-задача со сроком, каналом и владельцем; задача видна в передаче смены.'},
      {title:'Возврат упущенных из журнала',critical:false,copy:'Фильтр «Пропущен / без результата» и кнопка «Вернуть в работу» создают задачу с дедлайном и владельцем в очереди смены.'}
    ];
    const quizBase=[
      {q:'Когда обращение считается переданным врачу?',a:['После отправки карточки','После нажатия врачом «Принять обращение»','После завершения звонка'],ok:1,critical:true},
      {q:'Кому направлять срочный вопрос с красными флагами?',a:['Только лечащему врачу','Первому доступному врачу экстренной группы или дежурному','Любому администратору'],ok:1,critical:true},
      {q:'Что нужно сделать перед завершением смены?',a:['Закрыть браузер','Назначить владельца, следующий шаг и срок всем открытым задачам','Оставить заметку без срока'],ok:1,critical:false}
    ];
    const quizAdmin=[
      {q:'Пациент просит «только прайс» (скрипт S05). Чего нельзя делать?',a:['Уточнить услугу и перевести к консультации','Отправить файл прайса и закончить диалог','Предложить два окна записи после ориентира'],ok:1,critical:true,source:'scripts-25.json · S05 · dont_say'},
      {q:'Пациент говорит о страхе боли (скрипт S08). Какая формулировка запрещена как гарантия?',a:['Спросить, что именно пугает: боль, анестезия, результат или процесс','Сказать «это совсем не больно» как гарантию','Предложить консультацию и следующий шаг'],ok:1,critical:true,source:'scripts-25.json · S08 · dont_say'},
      {q:'Пациент получил ориентир цены и исчез (правило повторного касания). Какой лимит?',a:['Писать каждый день до ответа','Одно содержательное касание','Отправить весь прайс повторно'],ok:1,critical:true,source:'recontact-9.json · R03 · limit'},
      {q:'Где администратор открывает каталог скриптов и повторные касания?',a:['Только в бумажной папке ресепшена','В /render/: «Скрипты» и «Повторные касания»','В личном WhatsApp без фиксации'],ok:1,critical:false,source:'workspace UI · /render/'},
      {q:'Можно ли обещать скидку, подарок или баллы за публичный отзыв?',a:['Да, если пациент доволен','Нет — reward-for-review запрещён','Да, только за 5 звёзд'],ok:1,critical:true,source:'admin-feedback-sop.json · prohibitions · reward'},
      {q:'Как относиться к площадкам Яндекс / 2ГИС / Google при просьбе об отзыве?',a:['Только Яндекс обязателен, остальные запрещены','Равный контур: не навязывать одну площадку как условие просьбы','Только Google, иначе отзыв не считается'],ok:1,critical:true,source:'admin-feedback-sop.json · platforms · I5.2'}
    ];
    const updates=roleKey==='admin'?updatesAdmin:updatesBase;
    const quiz=roleKey==='admin'?quizAdmin:quizBase;
    let view='today';
    function renderNav(){
      const common=[['today','Сегодня'],['learn','Обучение'],['shift','Смена']];
      const pathItem=(roleKey==='admin'||roleKey==='doctor')?[['path','Путь']]:[];
      const specific=roleKey==='admin'?[['work','Обращения']]:roleKey==='doctor'?[['work','Медицинские задачи']]:[['work','Команда']];
      const items=[...common,...pathItem,...specific];
      $('nav').innerHTML=$('mobileNav').innerHTML=items.map(([id,label])=>`<button class="btn ${view===id?'active':''}" data-view="${id}">${label}</button>`).join('');
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
    }
    function gate(){

    const INBOX_OWNERS=['Администратор','Старший администратор','Дежурный врач','Координатор'];
    const DEMO_INBOX=[
      {id:'in-call-01',channel:'Звонок',channelKey:'call',patient:'Нурлан С.',need:'Острая боль · жевательный зуб',at:'Сегодня 09:12',owner:'Администратор',defaultStatus:'новое',source:'Карты (заглушка до I8)',nextAction:'Перезвонить и предложить ближайшее окно'},
      {id:'in-wa-01',channel:'WhatsApp',channelKey:'whatsapp',patient:'Айгуль К.',need:'Передние зубы · эстетика / виниры',at:'Сегодня 10:05',owner:'Администратор',defaultStatus:'в работе',source:'Instagram (заглушка до I8)',nextAction:'Уточнить ожидания по эстетике и предложить консультацию'},
      {id:'in-form-01',channel:'Форма',channelKey:'form',patient:'Сезим Б.',need:'Консультация по имплантации',at:'Вчера 18:40',owner:'Администратор',defaultStatus:'записан',source:'Сайт (заглушка до I8)',nextAction:'Подтвердить запись и напомнить про снимок'}
    ];
    function ensureInboxStatuses(){
      if(!state.inboxStatuses||typeof state.inboxStatuses!=='object')state.inboxStatuses={};
      DEMO_INBOX.forEach((item)=>{
        if(!INBOX_SLA.includes(state.inboxStatuses[item.id]))state.inboxStatuses[item.id]=item.defaultStatus||'новое';
      });
    }
    function ensureInboxCards(){
      if(!state.inboxCards||typeof state.inboxCards!=='object')state.inboxCards={};
      DEMO_INBOX.forEach((item)=>{
        const cur=state.inboxCards[item.id]||{};
        state.inboxCards[item.id]={
          channel:cur.channel||item.channel,
          need:cur.need||item.need,
          source:cur.source||item.source||INBOX_SOURCES[0],
          nextAction:cur.nextAction||item.nextAction||'',
          owner:cur.owner||item.owner||INBOX_OWNERS[0]
        };
      });
      if(!state.inboxSelectedId||!DEMO_INBOX.some((x)=>x.id===state.inboxSelectedId))state.inboxSelectedId=DEMO_INBOX[0].id;
    }
    function inboxStatusClass(status){
      if(status==='упущен')return'status-danger';
      if(status==='передан врачу'||status==='записан')return'status-ok';
      if(status==='в работе')return'status-warn';
      return'muted';
    }
    function inquiryCardHtml(){
      ensureInboxCards();
      ensureInboxStatuses();
      const item=DEMO_INBOX.find((x)=>x.id===state.inboxSelectedId)||DEMO_INBOX[0];
      const card=state.inboxCards[item.id];
      const status=state.inboxStatuses[item.id]||item.defaultStatus||'новое';
      const channelOpts=['Звонок','WhatsApp','Форма'].map((c)=>`<option value="${esc(c)}"${c===card.channel?' selected':''}>${esc(c)}</option>`).join('');
      const sourceOpts=INBOX_SOURCES.map((s)=>`<option value="${esc(s)}"${s===card.source?' selected':''}>${esc(s)}</option>`).join('');
      const ownerOpts=INBOX_OWNERS.map((o)=>`<option value="${esc(o)}"${o===card.owner?' selected':''}>${esc(o)}</option>`).join('');
      const slaOpts=INBOX_SLA.map((s)=>`<option value="${esc(s)}"${s===status?' selected':''}>${esc(s)}</option>`).join('');
      return `<div class="card action-card" data-atom="i13-inquiry-card" data-inbox-card="${esc(item.id)}" style="margin-top:14px"><div class="eyebrow">I1.3 · единая карточка</div><h3>${esc(item.patient)}</h3><p class="muted">${esc(item.at)} · SLA: <b class="${inboxStatusClass(status)}">${esc(status)}</b></p><p class="muted">Все ключевые поля на одной карточке. Источник — заглушка до I8.</p>
        <div class="stack" style="margin-top:12px">
          <label class="muted" style="font-size:12px">Канал</label>
          <select id="inqChannel" class="btn secondary" style="width:100%;text-align:left">${channelOpts}</select>
          <label class="muted" style="font-size:12px">Потребность</label>
          <textarea id="inqNeed" class="btn secondary" style="width:100%;min-height:72px;text-align:left;font-weight:500;resize:vertical">${esc(card.need)}</textarea>
          <label class="muted" style="font-size:12px">Источник <span class="badge demo">до I8</span></label>
          <select id="inqSource" class="btn secondary" style="width:100%;text-align:left">${sourceOpts}</select>
          <label class="muted" style="font-size:12px">Next action</label>
          <textarea id="inqNext" class="btn secondary" style="width:100%;min-height:72px;text-align:left;font-weight:500;resize:vertical">${esc(card.nextAction)}</textarea>
          <label class="muted" style="font-size:12px">Владелец</label>
          <select id="inqOwner" class="btn secondary" style="width:100%;text-align:left">${ownerOpts}</select>
          <label class="muted" style="font-size:12px">SLA-статус</label>
          <select id="inqSla" class="btn secondary" style="width:100%;text-align:left">${slaOpts}</select>
        </div>
        <div class="header-actions" style="margin-top:12px"><button id="inqSave" type="button" class="btn primary">Сохранить карточку</button><button id="inqOpenRender" type="button" class="btn secondary">В /render/</button></div>
        <p class="muted" style="margin-top:10px">Поля: канал · потребность · источник · next action · владелец (+ SLA из I1.2).</p></div>`;
    }
    function inboxListHtml(){
      ensureInboxStatuses();
      ensureInboxCards();
      const rows=DEMO_INBOX.map((item)=>{
        const status=state.inboxStatuses[item.id]||item.defaultStatus||'новое';
        const card=state.inboxCards[item.id]||{};
        const active=item.id===state.inboxSelectedId;
        return `<article class="card ${active?'action-card':''}" data-inbox-id="${esc(item.id)}" data-inbox-channel="${esc(item.channelKey)}" data-inbox-status="${esc(status)}" data-atom="i12-sla-status" style="padding:12px 14px"><div class="task" style="border:0;padding:0"><span><b>${esc(item.patient)}</b><br><span class="muted">${esc(card.need||item.need)}</span><br><span class="muted">${esc(item.at)} · ${esc(card.owner||item.owner)} · ${esc(card.channel||item.channel)}</span></span><b class="${inboxStatusClass(status)}">${esc(status)}</b></div><button type="button" class="btn ${active?'primary':'secondary'}" data-inbox-open="${esc(item.id)}" style="width:100%;margin-top:10px">${active?'Карточка открыта':'Открыть карточку'}</button></article>`;
      }).join('');
      const counts=INBOX_SLA.map((s)=>{
        const n=DEMO_INBOX.filter((item)=>(state.inboxStatuses[item.id]||item.defaultStatus)===s).length;
        return `<span class="badge">${esc(s)} · ${n}</span>`;
      }).join('');
      return `<div class="card action-card" data-atom="i11-unified-inbox"><div class="eyebrow">Пункт 1 · inbox</div><h3>Единый inbox обращений</h3><p class="muted">Один список входящих из каналов-демо: звонок / WhatsApp / форма. Откройте карточку — канал, потребность, источник, next action и владелец на одном экране (I1.3).</p><div class="header-actions" style="margin-top:10px"><span class="badge">Звонок</span><span class="badge">WhatsApp</span><span class="badge">Форма</span></div><div class="header-actions" style="margin-top:8px">${counts}</div><div class="stack" style="margin-top:12px">${rows}</div><div class="metric" style="margin-top:12px">${DEMO_INBOX.length}</div><p class="muted">обращения в демо-очереди</p>${inquiryCardHtml()}<div class="header-actions" style="margin-top:12px;flex-direction:column;align-items:stretch"><a class="btn primary" href="/render/">Открыть /render/ · журнал</a><a class="btn secondary" href="/render/#scripts">Скрипты</a><a class="btn secondary" href="/render/#recontact">Повторные касания</a></div></div>`;
    }
    function bindInboxSla(){
      document.querySelectorAll('[data-inbox-status-select]').forEach((el)=>{
        el.onchange=()=>{
          const id=el.getAttribute('data-inbox-status-select');
          const value=el.value;
          if(!id||!INBOX_SLA.includes(value))return;
          state.inboxStatuses[id]=value;
          save();
          work();
        };
      });
    }
    function bindInquiryCard(){
      document.querySelectorAll('[data-inbox-open]').forEach((btn)=>{
        btn.onclick=()=>{
          state.inboxSelectedId=btn.getAttribute('data-inbox-open')||'';
          save();
          work();
        };
      });
      if($('inqSave'))$('inqSave').onclick=()=>{
        const id=state.inboxSelectedId;
        if(!id)return;
        ensureInboxCards();
        state.inboxCards[id]={
          channel:($('inqChannel')&&$('inqChannel').value)||'Звонок',
          need:($('inqNeed')&&$('inqNeed').value.trim())||'',
          source:($('inqSource')&&$('inqSource').value)||INBOX_SOURCES[0],
          nextAction:($('inqNext')&&$('inqNext').value.trim())||'',
          owner:($('inqOwner')&&$('inqOwner').value)||INBOX_OWNERS[0]
        };
        const sla=$('inqSla')&&$('inqSla').value;
        if(INBOX_SLA.includes(sla))state.inboxStatuses[id]=sla;
        save();
        work();
      };
      if($('inqOpenRender'))$('inqOpenRender').onclick=()=>{location.href='/render/'};
    }
    function work(){
      if(roleKey==='admin'&&!state.testPassed)return accessBlocked('Работа ограничена','Без успешно сданного теста (≥90%, критические 100%) модуль обращений недоступен.');
      const admin=`<div class="grid">${inboxListHtml()}<div class="card"><h3>Контроль смены</h3><p>Пропущенные: 2<br>Обещанные звонки: 3<br>Без результата: 0</p><p class="muted" style="margin-top:10px">Журнал I7.5: фильтр «Пропущен / без результата» и «Вернуть в работу».</p></div></div>${state.shiftStarted?adminPostVisitCardHtml():''}`;
      const doctor=`<div class="grid"><div class="card"><h3>Запрос на принятие обращения</h3><p><b>Мария Ивановна</b><br>Вопрос после удаления зуба · боль 4–6 · отёк не растёт</p><button class="btn primary">Принять обращение</button></div><div class="card"><h3>Статус врача</h3><p>Сейчас: свободен<br>Дежурство: не принято</p><button class="btn primary">Принять дежурство</button></div></div>`;
      const manager=managerTeamHtml();
      const owner=`<div class="grid"><div class="card"><h3>Состояние клиники</h3><div class="metric">87%</div><p class="muted">Смены открыты · дежурный назначен · 1 просроченный допуск</p></div><div class="card"><h3>Контроль стандартов</h3><p>Обращения без владельца: 0<br>Срочные обращения: 1<br>Среднее время принятия: 3 мин</p><button class="btn primary">Открыть сводку</button></div></div>`;
      layout(roleKey==='admin'?'Обращения':roleKey==='doctor'?'Медицинские задачи':roleKey==='manager'?'Команда и контроль':'Сводка клиники',roleKey==='admin'?admin:roleKey==='doctor'?doctor:roleKey==='manager'?manager:owner);
      if(roleKey==='admin'){bindPostVisitChecklist();bindInboxSla();bindInquiryCard();}
      if(roleKey==='manager')bindManagerFeedback();
    }
    function renderRight(){
      const g=gate();
      const feedbackLine=roleKey==='admin'
        ?`<div class="card"><b>Урок «Когда просить отзыв»</b><br><span class="${state.feedbackLessons.whenToAsk?'status-ok':'status-warn'}">${state.feedbackLessons.whenToAsk?'Прочитано':'Ожидает'}</span></div><div class="card"><b>Урок «QR и три площадки»</b><br><span class="${state.feedbackLessons.qrPlatforms?'status-ok':'status-warn'}">${state.feedbackLessons.qrPlatforms?'Прочитано':'Ожидает'}</span></div>`
        :'';
      const postVisitLine=roleKey==='admin'&&state.shiftStarted?(()=>{const p=postVisitProgress();return `<div class="card"><b>Чеклист после визита</b><br><span class="${p.complete?'status-ok':'status-warn'}">${p.complete?'Выполнен':p.done+'/'+p.total+' шагов'}</span></div>`})():'';
      const managerFeedbackLine=roleKey==='manager'?(()=>{const s=feedbackTeamStats();return `<div class="card"><b>Уроки регламента отзывов</b><br><span class="${s.pct===100?'status-ok':'status-warn'}">${s.pct}% · ${s.passed}/${s.total}</span></div>`})():'';
      $('todayTitle').textContent=g.title;
      $('todayList').innerHTML=`<div class="card"><b>Обновления</b><br><span class="${state.updateRead?'status-ok':'status-danger'}">${state.updateRead?'Пройдено':'Ожидает'}</span></div><div class="card"><b>Тест</b><br><span class="${state.testPassed?'status-ok':'status-danger'}">${state.testPassed?'Пройден '+state.score+'%':'Не пройден'}</span></div>${feedbackLine}${postVisitLine}${managerFeedbackLine}<div class="card"><b>Смена</b><br>${state.shiftStarted?'В работе':state.handoffAccepted?'Готова к старту':'Не принята'}</div>`;
      $('shiftBadge').textContent=state.shiftStarted?'Смена активна':'Смена не начата';
    }
    function render(){renderNav();renderRight();({today,learn,shift,work,path:pathView}[view]||today)()}
    $('roleLabel').textContent=role.name+' · '+role.subtitle;
    render();
  })();
  </script>
</body>
</html>
